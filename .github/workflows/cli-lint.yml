name: CLI Lint

# `cd cli && just check` is the documented pre-commit gate. cli.yml already
# covers its test, contract-test and gen-skills-check recipes; this workflow
# covers the remaining two, lint and vulncheck.
#
# Separate from cli.yml because the triggers differ: cli.yml also runs on
# backend changes so the contract tests can catch backend drift, but nothing
# in backend/ can change the result of linting or scanning the cli module.
#
# Scope note: cli/test/contract is a separate Go module, so `./...` does not
# reach it and neither job covers it. It is test-only and ships nothing.
on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli-lint.yml"
  pull_request:
    types: [labeled]
    paths:
      - "cli/**"
      - ".github/workflows/cli-lint.yml"
  # A CVE lands in the vulnerability database without anyone pushing a commit.
  # Without this, the vulncheck job below could only ever fire on a cli/ change
  # -- 6% of commits -- so a new advisory could sit unreported for weeks.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs, not one: a lint nit and a stdlib CVE are different signals, and
# neither should mask the other.
jobs:
  lint:
    # The daily run exists for the vulnerability database. Lint is pinned and
    # deterministic, so re-running it on a timer would only add noise.
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.label.name == 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # Pinned, not `latest`: a new linter release must never turn an unrelated
      # PR red. CI is authoritative for the version -- the flake.nix dev shell
      # takes whatever golangci-lint its nixpkgs input carries and cannot pin
      # one, so a local `just lint` can legitimately differ after a flake update.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: cli

  vulncheck:
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # Pinned like the linter, and for the same reason. Pinning costs no
      # freshness: govulncheck fetches the advisory database from vuln.go.dev
      # at run time, so the schedule above is what keeps this current, not the
      # tool version.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Vulncheck
        run: govulncheck ./...
