name: Release Docs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # "latest" resolves to Node Current, which the runner tool cache does
          # not ship -- an unpinned input, re-downloaded, on a production deploy.
          # docs/package.json has no engines floor to catch it, so pin the major
          # the Dockerfiles and the release build use (#330).
          node-version: 22
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs
        working-directory: docs
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: deploy

      - name: Summary
        run: echo "Docs deployed (triggered by ${{ github.event_name }})." >> "$GITHUB_STEP_SUMMARY"
