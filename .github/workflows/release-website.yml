name: Release Website

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action bump is only about the Node 24 runtime. wrangler-action
          # v4 also changed its default Wrangler CLI from 3 to 4, which is a
          # separate migration on a production deploy path -- pinned here so
          # this change moves one thing. Drop the pin to take Wrangler 4.
          wranglerVersion: "3"
          workingDirectory: website
          command: deploy

      - name: Summary
        run: echo "Website deployed (triggered by ${{ github.event_name }})." >> "$GITHUB_STEP_SUMMARY"
