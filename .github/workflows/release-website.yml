name: Release Website

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action v4 defaults to the Wrangler 4 CLI, a separate
          # migration on a production deploy path. Pinned so this change is
          # only the runtime move.
          # Unpinning is tracked in #331.
          wranglerVersion: "3"
          workingDirectory: website
          command: deploy

      - name: Summary
        run: echo "Website deployed (triggered by ${{ github.event_name }})." >> "$GITHUB_STEP_SUMMARY"
