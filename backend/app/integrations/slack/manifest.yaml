display_information:
  name: Traceway
  description: Fix issues from Slack with the Traceway agent
  background_color: "#1d4ed8"
features:
  bot_user:
    display_name: Traceway
    always_online: true
  slash_commands:
    - command: /traceway
      description: Ask the Traceway agent to fix an issue
      usage_hint: fix <issue url or hash>
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - chat:write.public
      - commands
      - groups:history
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
