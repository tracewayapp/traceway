		<script>
			// Default to dark; honor stored preference if the user has set one.
			// An embedded dashboard takes ?theme= from the page that frames it.
			try {
				var stored =
					location.pathname === '/embed/dashboard'
						? new URLSearchParams(location.search).get('theme')
						: localStorage.getItem('traceway_theme');
				if (stored === 'light') {
					document.documentElement.classList.remove('dark');
					document.documentElement.style.colorScheme = 'light';
					document.documentElement.style.background = '';
				}
			} catch (e) {}
		</script>

				transform-origin: 250px 250px;
			}

				}
			}
