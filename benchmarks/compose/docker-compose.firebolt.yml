# Firebolt Core (self-managed engine) for the direct-Firebolt telemetry
# benchmark in benchmarks/firebolt/. HTTP SQL API on :3473.
services:
  firebolt:
    image: ghcr.io/firebolt-db/engine:dev
    container_name: firebolt
    command: ["server", "--data-dir", "/var/lib/firebolt"]
    ports:
      - "3473:3473"
    volumes:
      - firebolt-data:/var/lib/firebolt
    ulimits:
      memlock:
        soft: 8589934592
        hard: 8589934592
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3473 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  firebolt-data:
