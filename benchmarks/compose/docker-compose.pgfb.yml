# pgfb mode: Postgres main DB + Firebolt telemetry — the Firebolt twin of
# docker-compose.pgch.yml. The Firebolt engine image is a dev preview; pin a
# different tag via FIREBOLT_IMAGE when Firebolt publishes stable ones.
services:
  traceway:
    build:
      context: ../..
      dockerfile: Dockerfile.firebolt
    ports:
      - "${BENCH_PORT:-8087}:80"
    environment:
      FIREBOLT_URL: "http://firebolt:3473"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: "traceway"
      POSTGRES_USERNAME: "traceway"
      POSTGRES_PASSWORD: "traceway"
      POSTGRES_SSLMODE: "disable"
      JWT_SECRET: "bench-jwt-secret-not-for-production-use-only-32chars+"
      HEALTH_DEEP_TOKEN: "bench-health-token-not-for-production"
      GIN_MODE: "release"
    depends_on:
      firebolt:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  firebolt:
    image: "${FIREBOLT_IMAGE:-ghcr.io/firebolt-db/engine:dev}"
    command: ["server", "--data-dir", "/var/lib/firebolt", "--server-config", "/etc/firebolt/config.yaml"]
    # seccomp=unconfined lets the engine use io_uring on Linux hosts (the
    # default Docker profile blocks it; without it spilling and the disk
    # cache are disabled and VACUUM of large tables fails).
    security_opt:
      - seccomp:unconfined
    # The engine sizes its memory budget from the cgroup limit; uncapped it
    # takes the whole box and starves Postgres + the backend. 4g suits the
    # 8GB ccx13; pass FIREBOLT_MEM_LIMIT for bigger tiers (~half the box).
    mem_limit: "${FIREBOLT_MEM_LIMIT:-4g}"
    volumes:
      - firebolt-bench-data:/var/lib/firebolt
      - ./firebolt-config.yaml:/etc/firebolt/config.yaml:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3473 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 30
    restart: on-failure:3
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: traceway
      POSTGRES_PASSWORD: traceway
      POSTGRES_DB: traceway
    volumes:
      - postgres-bench-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceway"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    restart: on-failure:3

volumes:
  firebolt-bench-data:
  postgres-bench-data:
