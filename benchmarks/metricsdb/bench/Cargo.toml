[package]
name = "metricsdb-bench"
version = "0.1.0"
edition = "2021"
description = "Ingest, disk and query benchmark for OTel metrics stores (VictoriaMetrics, ClickHouse, DuckDB, Firebolt Core)"

[dependencies]
anyhow = "1"
async-channel = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
humantime = "2"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process"] }
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

snap = { version = "1", optional = true }
duckdb = { version = "=1.10505.0", optional = true, features = ["appender-arrow"] }
arrow = { version = "58", optional = true }
parquet = { version = "58", optional = true, default-features = false, features = ["arrow", "snap"] }

[features]
default = ["clickhouse", "victoria", "duckdb", "firebolt"]
clickhouse = []
victoria = ["dep:snap"]
duckdb = ["dep:duckdb", "dep:arrow"]
firebolt = ["dep:arrow", "dep:parquet"]

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1
