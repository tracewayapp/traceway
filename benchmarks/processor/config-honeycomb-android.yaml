receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  proguard_symbolicator:
    proguard_store: file_store
    local_store:
      path: ${env:STORE_PATH}
    proguard_cache_size: ${env:CACHE_SIZE:-128}
    preserve_stack_trace: false
    allowed_languages: [android]

exporters:
  otlphttp/drain:
    endpoint: ${env:DRAIN_ENDPOINT}
    compression: none
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [otlp]
      processors: [proguard_symbolicator]
      exporters: [otlphttp/drain]
