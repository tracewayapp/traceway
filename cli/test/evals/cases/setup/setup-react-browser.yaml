id: setup-react-browser
suite: setup
title: Add the Traceway browser SDK to a React + Vite SPA, with debug IDs and source map upload in CI
tags: [browser, react, vite]
seed: setup/react-browser
arms: [cli+setup-skill]
invoke: natural
workspace: {repo: shop-web-vite}
setup:
  path: fast
  token: ingest
  env:
    VITE_TRACEWAY_URL: "@url"
    VITE_TRACEWAY_TOKEN: "@token:shop-web"
  # A browser SDK only reports from a browser, so the build is the check:
  # the installed SDK is 2.1 or later (the first with the token start), and
  # the bundle carries its OTLP export, the token and the server URL taken
  # from the environment, debug IDs and source maps. dist/ is removed
  # afterwards because the bundle legitimately holds the (public) browser
  # token.
  verify:
    build: |
      set -e
      npm install --no-audit --no-fund --loglevel=error
      node -e '
        const v = JSON.parse(require("fs").readFileSync("node_modules/@tracewayapp/react/package.json", "utf8")).version;
        const [major, minor] = v.split(".").map(Number);
        if (major !== 2 || minor < 1) { console.log("@tracewayapp/react " + v + " is installed; the token start needs 2.1.0 or later"); process.exit(1); }
      '
      npm run build
      grep -rqF -- "/api/otel/v1/" dist/assets || { echo "the bundle has no OTLP export, so no 2.x browser SDK"; exit 1; }
      grep -rqF -- "$VITE_TRACEWAY_TOKEN" dist/assets || { echo "the bundle does not carry the token from VITE_TRACEWAY_TOKEN"; exit 1; }
      grep -rqF -- "$VITE_TRACEWAY_URL" dist/assets || { echo "the bundle does not carry the server URL from VITE_TRACEWAY_URL"; exit 1; }
      ls dist/assets/*.js.map > /dev/null 2>&1 || { echo "the build emits no source maps"; exit 1; }
      grep -qE '//# debugId=[0-9a-fA-F-]{36}' dist/assets/*.js || { echo "the bundles carry no debug IDs"; exit 1; }
      rm -r dist
prompt: |
  Please add Traceway browser monitoring to our storefront. We self-host Traceway at {{env.url}} and the "shop-web" project (React) is already set up. The build reads the project's ingest token from VITE_TRACEWAY_TOKEN and the instance URL from VITE_TRACEWAY_URL; both are set on this machine, and in CI as the secret VITE_TRACEWAY_TOKEN and the repository variable VITE_TRACEWAY_URL. CI also has the project's source map upload token as the secret TRACEWAY_SOURCEMAP_TOKEN. That one only exists in CI, so `npm run build` has to keep working without it.
budget: {max_turns: 45, max_tool_calls: 40, max_output_tokens: 20000, timeout: 20m}
user:
  - match: "(?i)backend|api project|opentelemetry|otel"
    reply: "The API is a separate service with its own project; only the storefront in this change."
  - default: "Yes, go ahead."
expect:
  state:
    # First, so a run on the 2.0 start reads as that in the summary.
    - kind: file
      path: "**/*.{js,jsx,ts,tsx,mjs}"
      not_contains: ["\\bconnectionString\\b", "/api/report"]
      note: "the 2.0 connectionString prop still works in 2.1 but is deprecated; 2.1 starts with token and, for a self-hosted server, baseUrl"
    - kind: file
      path: package.json
      contains:
        - "\"@tracewayapp/react\":\\s*\"[\\^~]?(>=\\s*)?2\\.([1-9]|[1-9][0-9])\\.[0-9]+"
        - "\"@tracewayapp/bundler-plugin\""
    - kind: file
      path: "vite.config.*"
      contains: ["tracewayDebugIds", "sourcemap:\\s*(true|['\"]hidden['\"])"]
    # <TracewayProvider token={...} baseUrl={...}>, or the same props from
    # an object ({ token, baseUrl } spread in), read from the VITE_ variables.
    - kind: file
      path: "**/*.{js,jsx,ts,tsx}"
      contains:
        - "<TracewayProvider\\b"
        - "\\btoken\\s*(=\\s*\\{|:)|[{,]\\s*token\\s*[,}]"
        - "\\bbaseUrl\\s*(=\\s*\\{|:)|[{,]\\s*baseUrl\\s*[,}]"
        - "VITE_TRACEWAY_TOKEN"
        - "VITE_TRACEWAY_URL"
    - kind: file
      path: ".github/workflows/*"
      contains: ["VITE_TRACEWAY_TOKEN", "VITE_TRACEWAY_URL", "traceway-sourcemaps|@tracewayapp/sourcemap-upload", "TRACEWAY_SOURCEMAP_TOKEN", "(^|[^A-Z_])TRACEWAY_URL|--url"]
    - kind: no_token_literal
    - kind: no_token_printed
  calls:
    required:
      - {op: load_skill, args: {name: traceway-setup}}
    forbidden:
      - {op: "*", write: true}
judge:
  expected: The agent installs @tracewayapp/react 2.1 and wraps the app in <TracewayProvider token={import.meta.env.VITE_TRACEWAY_TOKEN} baseUrl={import.meta.env.VITE_TRACEWAY_URL}> (baseUrl because the server is self-hosted; no token in source, no connection string), adds @tracewayapp/bundler-plugin's tracewayDebugIds() with build.sourcemap enabled, and runs traceway-sourcemaps as a CI step after the build with TRACEWAY_SOURCEMAP_TOKEN and TRACEWAY_URL (or --url), not as a postbuild hook that would break local builds. CI's build step gets VITE_TRACEWAY_TOKEN and VITE_TRACEWAY_URL from the secret and variable. It does not use OpenTelemetry in the browser.
  rubric:
    - Uses the browser SDK 2.1 (@tracewayapp/react, TracewayProvider), not OpenTelemetry, started with token and baseUrl from the VITE_ variables, not a connection string.
    - Adds the bundler plugin and enables source maps, so production stacks resolve.
    - Uploads source maps from CI with the upload token and the uploader's TRACEWAY_URL/--url, keeping npm run build working without the upload token.
    - Wires VITE_TRACEWAY_TOKEN and VITE_TRACEWAY_URL into the CI build, and never prints or hard-codes the token.
oracle:
  - load_skill: traceway-setup
  - read_file: package.json
  - read_file: src/main.jsx
  - read_file: vite.config.js
  - read_file: .github/workflows/deploy.yml
  - shell: npm install --no-audit --no-fund --loglevel=error @tracewayapp/react@2.1.0 && npm install --no-audit --no-fund --loglevel=error -D @tracewayapp/bundler-plugin@2.1.0 @tracewayapp/sourcemap-upload@2.1.0 && npm ls --depth=0
  - write_file: {path: src/main.jsx, from: oracle/setup-react-browser/main.jsx}
  - write_file: {path: vite.config.js, from: oracle/setup-react-browser/vite.config.js}
  - write_file: {path: .github/workflows/deploy.yml, from: oracle/setup-react-browser/deploy.yml}
  - shell: |
      npm run build 2>&1 | tail -n 6
      echo "bundles with a debug ID: $(grep -lE '//# debugId=' dist/assets/*.js | wc -l)"
      echo "source maps: $(ls dist/assets/*.js.map | wc -l)"
      echo "bundles with the OTLP export: $(grep -lF '/api/otel/v1/' dist/assets/*.js | wc -l)"
  - finish:
      summary: |
        shop-web now reports browser errors and session replay to the shop-web project. src/main.jsx wraps the app in TracewayProvider from @tracewayapp/react 2.1.0 (outside StrictMode, so development does not start two clients) with token={import.meta.env.VITE_TRACEWAY_TOKEN} and, because the server is self-hosted, baseUrl={import.meta.env.VITE_TRACEWAY_URL}, both read at build time; without a token the SDK stays off. vite.config.js enables source maps and adds tracewayDebugIds() from @tracewayapp/bundler-plugin, so every bundle and its map share a debug ID. The deploy workflow passes VITE_TRACEWAY_TOKEN and VITE_TRACEWAY_URL to the build, uploads the maps with traceway-sourcemaps (TRACEWAY_SOURCEMAP_TOKEN, TRACEWAY_URL from the repository variable), and deletes them from dist before the S3 sync. npm run build works locally without the upload token. To check it: deploy, throw a test error in the browser, and open /issues in the shop-web project.
      changes:
        - {action: wrap the app in TracewayProvider, target: src/main.jsx}
        - {action: enable source maps and debug IDs, target: vite.config.js}
        - {action: pass the Traceway variables to the build and upload source maps, target: .github/workflows/deploy.yml}
        - {action: "add @tracewayapp/react, @tracewayapp/bundler-plugin and @tracewayapp/sourcemap-upload 2.1.0", target: package.json}
