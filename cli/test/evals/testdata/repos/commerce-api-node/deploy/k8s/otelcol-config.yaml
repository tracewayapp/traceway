apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-api-otelcol
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http: {endpoint: "localhost:4318"}
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu:
            metrics: {system.cpu.utilization: {enabled: true}}
          memory:
            metrics: {system.memory.utilization: {enabled: true}}
    processors:
      resourcedetection: {detectors: [env, system]}
      batch: {}
    exporters:
      otlphttp:
        endpoint: https://traceway.example.com/api/otel
        headers: {Authorization: "Bearer ${env:TRACEWAY_TOKEN}"}
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [batch], exporters: [otlphttp]}
        logs: {receivers: [otlp], processors: [batch], exporters: [otlphttp]}
        metrics: {receivers: [otlp, hostmetrics], processors: [resourcedetection, batch], exporters: [otlphttp]}
