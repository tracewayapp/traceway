name: Release

on:
  push:
    tags: ["v*"]

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"
      - name: Write Config/Secrets.xcconfig
        env:
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: printf 'STRIPE_PUBLISHABLE_KEY = %s\n' "$STRIPE_PUBLISHABLE_KEY" > Config/Secrets.xcconfig
      - name: Archive
        run: >
          xcodebuild archive -project Shop.xcodeproj -scheme Shop -configuration Release
          -destination 'generic/platform=iOS' -archivePath build/Shop.xcarchive
      - uses: actions/upload-artifact@v4
        with:
          name: shop-archive
          path: build/Shop.xcarchive
