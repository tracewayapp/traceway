services:
  traceway:
    build:
      context: .
      dockerfile: Dockerfile.duckdb
    ports:
      - "80:80"
    environment:
      JWT_SECRET: "change-this-to-a-secure-secret-at-least-32-chars"
      # APP_BASE_URL: "https://traceway.example.com"

      # DuckDB sizes its memory budget from host RAM, not the container limit.
      # On any memory-capped deployment set this to roughly half the
      # container's RAM or the backend gets OOM-killed under ingest.
      DUCKDB_MEMORY_LIMIT: "2GB"
      # DUCKDB_THREADS: "4"
      # WAL checkpoint threshold. The backend defaults to 256MB (DuckDB's own
      # 16MB default stalls sustained ingest); lower it if restart replay time
      # matters more than ingest throughput.
      # DUCKDB_CHECKPOINT_THRESHOLD: "256MB"

      # Background write batcher for the hot telemetry tables. Defaults:
      # queue 131072 rows per table, flush at 32768 rows or 100ms. A 200 on
      # ingest means "accepted into the bounded queue"; a full queue answers
      # 503 + Retry-After and the SDK retries.
      # DUCKDB_WRITE_QUEUE_ROWS: "131072"
      # DUCKDB_WRITE_FLUSH_ROWS: "32768"
      # DUCKDB_WRITE_FLUSH_INTERVAL_MS: "100"
      # DUCKDB_WRITE_WRITERS: "4"
      # DUCKDB_WRITE_QUEUE_WAIT_MS: "2000"

      # Optional retention knobs. Defaults are 30 days; set to "0" to disable.
      # SQLITE_RETENTION_DAYS prunes telemetry rows (DuckDB telemetry included);
      # SESSION_RECORDING_RETENTION_DAYS cleans on-disk recordings under
      # STORAGE_PATH/recordings/. Both run hourly and on startup. The recording
      # cleanup has no effect when STORAGE_TYPE=s3.
      # SQLITE_RETENTION_DAYS: "30"
      # SESSION_RECORDING_RETENTION_DAYS: "30"

      # Optional: store blobs (source maps, session recordings, AI traces) in S3
      # instead of the local /data/storage folder.
      # STORAGE_TYPE: "s3"
      # S3_BUCKET: "your-bucket"
      # S3_REGION: "us-east-1"
      # S3_ACCESS_KEY: "your-access-key"
      # S3_SECRET_KEY: "your-secret-key"
      # S3_ENDPOINT: "https://s3.example.com"  # for MinIO / R2 / Spaces
    volumes:
      - traceway-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  traceway-data:
