# Diagram source for docs/public/runner-architecture.svg (server/runner.mdx).
# Rendered with isotopo (https://github.com/MarkovWangRR/iso-topology):
#   isotopo render docs/diagrams/runner-architecture.yaml <out-dir>
canvas: { background: "#E3E9F4", grid: "", padding: 70 }
theme:
  text: { family: "Inter, system-ui, sans-serif", size: 11, weight: "600", color: "#2A3548" }
  presets:
    panel:
      effects: { opacity: 0.92, cornerRadius: 14 }
      stroke: { color: "#DCE4F0", width: 0.75 }
      faces:
        top:
          fill:
            kind: linearGradient
            angle: 120
            stops:
              - { offset: 0, color: "#F6F9FD" }
              - { offset: 1, color: "#EAEFF7" }
          strokes:
            - { color: "#FFFFFF", width: 1, opacity: 0.45 }
        left: { fill: { kind: solid, color: "#E4EAF4" } }
        right: { fill: { kind: solid, color: "#EDF1F8" } }
    hero:
      effects:
        cornerRadius: 16
        faceSplit: true
        backglow: { color: "#5AA0FF", radius: 150, opacity: 0.7 }
        outline: { color: "#A9CCFF", width: 2, opacity: 0.9 }
        dropShadow: { dx: 0, dy: 12, blur: 28, color: "#1E50C880" }
      stroke: { color: "#7FB0FF", width: 1.5 }
      faces:
        top:
          fill:
            kind: linearGradient
            angle: 125
            stops:
              - { offset: 0, color: "#2F62DE" }
              - { offset: 1, color: "#1B44B4" }
          strokes:
            - { color: "#BBD8FF", width: 1.5, opacity: 0.95 }
        left:
          fill:
            kind: linearGradient
            angle: 90
            stops:
              - { offset: 0, color: "#244CB0" }
              - { offset: 1, color: "#15296E" }
        right:
          fill:
            kind: linearGradient
            angle: 90
            stops:
              - { offset: 0, color: "#3464D8" }
              - { offset: 1, color: "#1B3690" }
    runnerTile:
      effects: { opacity: 0.95, cornerRadius: 14 }
      stroke: { color: "#F0D9AC", width: 0.75 }
      faces:
        top:
          fill:
            kind: linearGradient
            angle: 120
            stops:
              - { offset: 0, color: "#FDEECF" }
              - { offset: 1, color: "#F8DFAC" }
          strokes:
            - { color: "#FFFFFF", width: 1, opacity: 0.5 }
        left: { fill: { kind: solid, color: "#F1D69E" } }
        right: { fill: { kind: solid, color: "#F7E3B9" } }
nodes:
  scene:
    shape: composite
    parts:
      - id: instance
        shape: group
        label: "Your Traceway instance"
        layout: { mode: row, gap: 1.5, padding: 1.1 }
        style:
          palette: { top: "#EDF1F8", left: "#DEE5F1", right: "#E7ECF6" }
          effects: { opacity: 0.55, cornerRadius: 18 }
          text: { color: "#5A6A85" }
        parts:
          - id: browserqueue
            shape: rectangle
            preset: panel
            geom: { w: 102, d: 102, h: 28 }
            icon: "iso://glyph/queue/2563EB"
            label: "Browser run queue"
          - id: backend
            shape: rectangle
            preset: hero
            geom: { w: 118, d: 118, h: 44 }
            icon: "iso://glyph/gauge/light"
            label: "Traceway backend"
            style: { text: { color: "#F1F5F9" } }
      - id: runnerhost
        shape: group
        label: "Runner host (no inbound ports)"
        place: { rightOf: instance, gap: 2.6 }
        layout: { mode: row, gap: 1.4, padding: 1.1 }
        style:
          palette: { top: "#F5EBD8", left: "#E9DBBE", right: "#F0E3CB" }
          effects: { opacity: 0.5, cornerRadius: 18 }
          text: { color: "#8A6A33" }
        parts:
          - id: runner
            shape: rectangle
            preset: runnerTile
            geom: { w: 110, d: 110, h: 36 }
            icon: "iso://glyph/terminal/B45309"
            label: "traceway-runner"
            style: { text: { color: "#7C3E0A" } }
          - id: harness
            shape: rectangle
            preset: runnerTile
            geom: { w: 100, d: 100, h: 28 }
            icon: "iso://si/nodedotjs/B45309"
            label: "Node + Playwright"
            style: { text: { color: "#7C3E0A" } }
          - id: chromium
            shape: rectangle
            preset: runnerTile
            geom: { w: 100, d: 100, h: 28 }
            icon: "iso://glyph/browser/B45309"
            label: "Headless Chromium"
            style: { text: { color: "#7C3E0A" } }
      - id: target
        shape: rectangle
        place: { inFrontOf: runnerhost, gap: 2.6 }
        geom: { w: 118, d: 104, h: 30 }
        icon: "iso://glyph/globe/1D4ED8"
        label: "Your app"
        style:
          palette: { top: "#DDEAFD", left: "#BAD4F9", right: "#CCDFFB" }
          text: { color: "#1E3A8A" }
          effects: { cornerRadius: 14, opacity: 0.95 }
          stroke: { color: "#B5CFF5", width: 0.75 }
    connectors:
      - { from: backend, to: browserqueue, routing: orthogonal, arrow: triangle, stroke: { color: "#6B7C99", width: 1.2 } }
      - { from: runner, to: backend, routing: orthogonal, arrow: triangle, label: "long-poll jobs + post results (Bearer secret)", stroke: { color: "#B45309", width: 1.4 } }
      - { from: runner, to: harness, routing: orthogonal, arrow: triangle, stroke: { color: "#A98035", width: 1.1 } }
      - { from: harness, to: chromium, routing: orthogonal, arrow: triangle, stroke: { color: "#A98035", width: 1.1 } }
      - { from: chromium, to: target, routing: orthogonal, arrow: triangle, label: "runs the check spec", stroke: { color: "#3464D8", width: 1.4 } }
