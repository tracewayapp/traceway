<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Chat — devtesting-embedded</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14171c; --border: #262b33; --text: #e6e9ed;
    --muted: #8b94a1; --accent: #4f8cff; --accent-soft: rgba(79, 140, 255, 0.12);
    --tool: #2a2f38; --ok: #3fbf7f; --warn: #e0a63d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel);
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .model { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  header .spacer { flex: 1; }
  select, button.secondary {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  #messages { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; gap: 10px; }
  .msg .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }
  .msg.user .avatar { background: var(--accent); color: #fff; }
  .msg.assistant .avatar { background: var(--tool); color: var(--muted); border: 1px solid var(--border); }
  .msg .bubble {
    padding: 8px 12px; border-radius: 10px; white-space: pre-wrap;
    word-break: break-word; max-width: 100%;
  }
  .msg.user .bubble { background: var(--accent-soft); }
  .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--border); }
  .events { display: flex; flex-direction: column; gap: 6px; margin-left: 38px; }
  .event {
    background: var(--tool); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .event .head { display: flex; align-items: center; gap: 8px; }
  .event .name { color: var(--text); font-family: ui-monospace, monospace; }
  .event .agent { font-size: 11px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
  .event .agent.sub { color: var(--warn); border-color: var(--warn); }
  .event .detail { display: none; margin-top: 6px; font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; word-break: break-word; }
  .event.open .detail { display: block; }
  .thinking { color: var(--muted); font-style: italic; margin-left: 38px; }
  .error { color: #ef6a6a; margin-left: 38px; font-size: 13px; }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  .footer-inner { max-width: 760px; margin: 0 auto; }
  .suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .suggestions button {
    background: var(--bg); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  .suggestions button:hover { color: var(--text); border-color: var(--accent); }
  .inputrow { display: flex; gap: 8px; }
  #input {
    flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  .session { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>AI Chat</h1>
  <span class="model" id="model">orcarouter</span>
  <span class="spacer"></span>
  <label class="session">user
    <select id="persona">
      <option value="alice@example.com">alice@example.com</option>
      <option value="bob@acme.io">bob@acme.io</option>
      <option value="carol@test.dev">carol@test.dev</option>
    </select>
  </label>
  <span class="session" id="session"></span>
  <button class="secondary" id="newconv">New conversation</button>
</header>

<div id="messages"><div class="inner" id="thread"></div></div>

<footer>
  <div class="footer-inner">
    <div class="suggestions">
      <button data-q="What's the weather in Paris?">weather tool</button>
      <button data-q="Where is my order A-1042?">order tool</button>
      <button data-q="What time is it on the server?">time tool</button>
      <button data-q="Ask the research agent: how does Traceway group AI conversations?">research sub-agent</button>
      <button data-q="What is 12 * (3 + 4) - 5? Use the math agent.">math sub-agent</button>
      <button data-q="Compare the weather in Paris and Tokyo, then tell me which order arrives first: A-1 or B-2.">multi-tool</button>
    </div>
    <div class="inputrow">
      <input id="input" placeholder="Ask something… tools fire when relevant" autocomplete="off" />
      <button id="send">Send</button>
    </div>
  </div>
</footer>

<script>
  const thread = document.getElementById('thread');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const persona = document.getElementById('persona');
  const sessionLabel = document.getElementById('session');

  let sessionId = newSessionId();
  let history = [];
  let busy = false;

  function newSessionId() {
    const id = 'chat-' + crypto.randomUUID().slice(0, 13);
    return id;
  }
  function renderSession() { sessionLabel.textContent = sessionId; }
  renderSession();

  document.getElementById('newconv').addEventListener('click', () => {
    sessionId = newSessionId();
    history = [];
    thread.innerHTML = '';
    renderSession();
    input.focus();
  });

  document.querySelectorAll('.suggestions button').forEach((b) => {
    b.addEventListener('click', () => { input.value = b.dataset.q; input.focus(); });
  });

  function addMessage(role, content) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.innerHTML = '<div class="avatar">' + (role === 'user' ? 'U' : 'A') + '</div><div class="bubble"></div>';
    el.querySelector('.bubble').textContent = content;
    thread.appendChild(el);
    scrollDown();
    return el;
  }

  function addEvents(events) {
    if (!events || !events.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'events';
    for (const ev of events) {
      const el = document.createElement('div');
      el.className = 'event';
      const isSub = ev.agent !== 'Support Chat Agent';
      el.innerHTML =
        '<div class="head"><span class="agent' + (isSub ? ' sub' : '') + '"></span>' +
        '<span class="name"></span><span>›</span><span class="args"></span></div>' +
        '<div class="detail"></div>';
      el.querySelector('.agent').textContent = ev.agent;
      el.querySelector('.name').textContent = ev.tool;
      el.querySelector('.args').textContent = ev.args;
      el.querySelector('.detail').textContent = 'result: ' + ev.result;
      el.addEventListener('click', () => el.classList.toggle('open'));
      wrap.appendChild(el);
    }
    thread.appendChild(wrap);
    scrollDown();
  }

  function addNote(cls, text) {
    const el = document.createElement('div');
    el.className = cls;
    el.textContent = text;
    thread.appendChild(el);
    scrollDown();
    return el;
  }

  function scrollDown() {
    const box = document.getElementById('messages');
    box.scrollTop = box.scrollHeight;
  }

  async function sendMessage() {
    const content = input.value.trim();
    if (!content || busy) return;
    busy = true;
    send.disabled = true;
    input.value = '';

    addMessage('user', content);
    history.push({ role: 'user', content });
    const thinking = addNote('thinking', 'thinking…');

    try {
      const resp = await fetch('/api/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, userId: persona.value, messages: history })
      });
      const data = await resp.json();
      thinking.remove();
      if (!resp.ok) {
        addNote('error', data.error || ('request failed: ' + resp.status));
        history.pop();
        return;
      }
      if (data.model) document.getElementById('model').textContent = data.model;
      addEvents(data.events);
      addMessage('assistant', data.reply || '(empty reply)');
      history.push({ role: 'assistant', content: data.reply || '' });
    } catch (e) {
      thinking.remove();
      addNote('error', String(e));
      history.pop();
    } finally {
      busy = false;
      send.disabled = false;
      input.focus();
    }
  }

  send.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
  input.focus();
</script>
</body>
</html>
