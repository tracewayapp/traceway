replicaCount: 1

image:
  repository: ghcr.io/tracewayapp/traceway
  pullPolicy: IfNotPresent
  # Overrides the image tag. Defaults to "<appVersion>-minimal" (or "<appVersion>-sqlite" when variant=sqlite).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: traceway.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

# Startup probe. The liveness budget only starts once this succeeds, so a slow
# first boot is not mistaken for a hung process. The server binds its ports only
# after migrations finish, and an upgrade that builds indexes on a large
# telemetry database can take minutes — without this the kubelet would kill the
# pod mid-migration and restart it into the same stall on every retry. Raise
# failureThreshold if an upgrade needs longer than periodSeconds x
# failureThreshold; the backend logs each migration and its elapsed time as it
# runs, so the container log says how much longer it needs.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Deployment variant:
#   "minimal" — external ClickHouse + PostgreSQL (recommended for production)
#   "sqlite"  — embedded SQLite, no external databases required
#   "full"    — all-in-one image with bundled ClickHouse + PostgreSQL (supervisord)
variant: minimal

# Core application settings
app:
  # Required. JWT signing secret (minimum 32 characters).
  jwtSecret: ""
  # Optional. Base URL used in password reset emails, e.g. "https://traceway.example.com"
  baseURL: ""
  # Comma-separated IPs/CIDRs of proxies whose X-Forwarded-For is trusted for
  # per-IP rate limiting, or "*". Defaults to loopback. Required when ingress
  # is enabled unless trustedProxyHeader is set; use the controller's pod CIDR.
  trustedProxies: ""
  # Alternative for ingress. A header trusted verbatim as the client IP, e.g. "X-Real-IP"
  # (overwritten by ingress-nginx on every request) or "CF-Connecting-IP".
  # Takes precedence over trustedProxies. Only safe when a NetworkPolicy
  # forces all traffic through the proxy that overwrites the header.
  trustedProxyHeader: ""
  # Optional. Set to "true" to serve only the API without the embedded frontend.
  apiOnly: ""
  # Optional. Cap on the decompressed /api/report body in megabytes. Default 64.
  reportMaxBodyMB: ""
  # Optional. Telemetry ingest requests processed at once. Default is 2x CPU
  # count with a floor of 4. Each admitted request can hold a decoded body, so
  # on a memory-capped container size this from the memory limit instead.
  ingestMaxConcurrent: ""
  # Optional. Source map and symbol uploads processed at once. Default 4.
  uploadMaxConcurrent: ""

# ClickHouse configuration — required when variant=minimal
clickhouse:
  server: ""           # e.g. "clickhouse.default.svc.cluster.local:9000"
  database: "traceway"
  username: "default"
  password: ""
  tls: "false"

# PostgreSQL configuration — required when variant=minimal
postgres:
  host: ""             # e.g. "postgres.default.svc.cluster.local"
  port: "5432"
  database: "traceway"
  username: "traceway"
  password: ""
  sslmode: "disable"

# SQLite configuration — only used when variant=sqlite
sqlite:
  path: "/data/traceway.db"
  retentionDays: "30"

# Session recording storage
storage:
  type: "local"   # "local" or "s3"
  path: "/data"
  s3:
    bucket: ""
    region: ""
    accessKey: ""
    secretKey: ""
    endpoint: ""   # Leave empty for AWS S3; set for MinIO or other S3-compatible stores

sessionRecording:
  retentionDays: "30"
  uploadWorkers: "32"
  uploadQueueSize: "2048"

# SMTP — optional, enables password reset emails
smtp:
  enabled: "false"
  host: ""
  port: "587"
  username: ""
  password: ""
  from: ""

# OAuth — optional social login
oauth:
  google:
    clientID: ""
    clientSecret: ""
  github:
    clientID: ""
    clientSecret: ""
  sessionSecret: ""

# OIDC — optional single sign-on
oidc:
  clientID: ""
  clientSecret: ""
  discoveryURL: ""
  displayName: ""
  autoCreateUsers: "false"
  orgClaim: ""
  extraScopes: ""
  roleClaim: ""
  roleMap: ""
  authURL: ""
  tokenURL: ""
  userInfoURL: ""

# Set to "true" to disable username/password login (use with OIDC/OAuth only)
disablePasswordLogin: "false"

# Persistent volume for local session recordings and/or SQLite data.
# Strongly recommended when variant=sqlite or storage.type=local.
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  existingClaim: ""

# Name of an existing Kubernetes Secret containing sensitive credentials.
# When set, the chart will NOT create its own Secret and will reference this one instead.
# The secret must contain: JWT_SECRET, and for variant=minimal: CLICKHOUSE_PASSWORD, POSTGRES_PASSWORD.
# Optional keys: SMTP_PASSWORD, S3_SECRET_KEY, OAUTH_SESSION_SECRET,
#   GOOGLE_CLIENT_SECRET, GITHUB_CLIENT_SECRET, OIDC_CLIENT_SECRET.
existingSecret: ""
