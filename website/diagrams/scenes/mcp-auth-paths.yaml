# Three credentials open the same door: OAuth (dynamic registration + PKCE),
# a personal access token, and a device-flow token from traceway login.
# Theme block is the shared Traceway brand palette (canonical copy:
# diagrams/traceway.yaml) inlined so the scene renders with a stock isotopo.
canvas: { background: "#05070C", padding: 76 }
theme:
  text: { family: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace", size: 11, weight: "500", color: "#8A93A6" }
  presets:
    hero:
      stroke: { color: "#8B78FF", width: 1.7 }
      palette: { left: "#150E33", right: "#1C1345" }
      faces:
        top: { fill: { kind: linearGradient, angle: 135, stops: [ { offset: 0, color: "#2C2160" }, { offset: 1, color: "#150D33" } ] } }
      effects: { cornerRadius: 12, faceSplit: true, opacity: 0.94, dropShadow: { dx: 0, dy: 14, blur: 26, color: "#00000099" }, backglow: { color: "#7C5CFF", radius: 74, opacity: 0.55 } }
      text: { color: "#ECE9FF" }
    tray:
      stroke: { color: "#2A3346", width: 1.4 }
      palette: { left: "#070A12", right: "#0A0E18" }
      faces:
        top: { fill: { kind: linearGradient, angle: 135, stops: [ { offset: 0, color: "#0E1320" }, { offset: 1, color: "#080B14" } ] } }
      effects: { cornerRadius: 12, faceSplit: true, opacity: 0.6, dropShadow: { dx: 0, dy: 14, blur: 26, color: "#00000099" } }
      text: { color: "#7E8798" }
    chip:
      stroke: { color: "#3A4560", width: 1.3 }
      palette: { left: "#0C111B", right: "#131926" }
      faces:
        top: { fill: { kind: linearGradient, angle: 135, stops: [ { offset: 0, color: "#171D2B" }, { offset: 1, color: "#10151F" } ] } }
      effects: { cornerRadius: 8, faceSplit: true, opacity: 0.95, dropShadow: { dx: 0, dy: 6, blur: 12, color: "#00000077" } }
      text: { color: "#C9D0DD" }

nodes:
  scene:
    shape: composite
    parts:
      # ============ HERO: the /mcp endpoint (right) ============
      - id: mcp
        offset: { wx: 320, wy: 0 }
        preset: hero
        shape: rectangle
        geom: { w: 210, d: 134, h: 32 }
        icon: "iso://glyph/bolt/ECE9FF"
        label: "Traceway · /mcp"

      # ============ OAuth path (top-left) ============
      - id: oauth
        offset: { wx: -330, wy: -300 }
        preset: tray
        shape: group
        label: "OAuth · self-serve"
        layout: { mode: column, gap: 0.7, padding: 1.35 }
        parts:
          - { id: dcr,     preset: chip, shape: rectangle, geom: { w: 132, d: 66, h: 18 }, icon: "iso://glyph/doc/light",     label: "dynamic registration" }
          - { id: consent, preset: chip, shape: rectangle, geom: { w: 132, d: 66, h: 18 }, icon: "iso://glyph/browser/light", label: "browser consent" }
          - { id: pkce,    preset: chip, shape: rectangle, geom: { w: 132, d: 66, h: 18 }, icon: "iso://glyph/key/light",     label: "PKCE + rotating refresh" }

      # ============ PAT path (mid-left) ============
      - id: pat
        offset: { wx: -330, wy: 100 }
        preset: tray
        shape: group
        label: "headless · CI"
        layout: { mode: row, gap: 0.7, padding: 1.35 }
        parts:
          - { id: patkey, preset: chip, shape: rectangle, geom: { w: 150, d: 70, h: 18 }, icon: "iso://glyph/lock/light", label: "personal access token" }

      # ============ Device-flow path (bottom-left) ============
      - id: device
        offset: { wx: -330, wy: 330 }
        preset: tray
        shape: group
        label: "traceway login"
        layout: { mode: row, gap: 0.7, padding: 1.35 }
        parts:
          - { id: devtok, preset: chip, shape: rectangle, geom: { w: 150, d: 70, h: 18 }, icon: "iso://glyph/terminal/light", label: "device-flow token" }

    connectors:
      - { from: oauth,  to: mcp, routing: orthogonal, arrow: triangle, stroke: { color: "#4FC8E8", width: 2.4, gradient: { from: "#00D4FF", to: "#7C5CFF" } } }
      - { from: pat,    to: mcp, routing: orthogonal, arrow: triangle, stroke: { color: "#4FC8E8", width: 2.0, gradient: { from: "#00D4FF", to: "#7C5CFF" } } }
      - { from: device, to: mcp, routing: orthogonal, arrow: triangle, stroke: { color: "#4FC8E8", width: 2.0, gradient: { from: "#00D4FF", to: "#7C5CFF" } } }
